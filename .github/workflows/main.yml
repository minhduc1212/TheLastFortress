name: Run FMHY Crawler

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Cho phép bạn bấm nút chạy thủ công trên GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Cấp quyền để action có thể commit code

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Crawler
        run: python crawler.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update fmhy_all_data.json"
          file_pattern: "fmhy_all_data.json"
